[workspace]
resolver = "2"
members = ["crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["openGemini-rs Team"]
license = "MIT"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roaring = "0.10"
lz4 = "1.9"
zstd = "0.12"
lz4_flex = "0.11"
snap = "1.1"
crc32fast = "1.3"
byteorder = "1.5"
parking_lot = "0.12"
once_cell = "1.19"
tracing = "0.1"
bincode = "1.3"
tempfile = "3.10"
criterion = "0.8"

[profile.release]
opt-level = 3